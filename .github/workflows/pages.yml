name: Pages

# Despliega solo cuando el CI de main termina en verde (o a mano).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Solo despliega: a mano, o tras un CI verde de un push a main de este mismo repo (nunca de un fork ni de un PR).
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
      && (!github.event.repository.private || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Comprobar que es el último commit de main
        run: |
          git fetch --quiet origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Hay un commit más nuevo en main: no se despliega este."; exit 1; }
      - name: Preparar sitio con la versión del commit
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          build="$(git rev-parse --short=8 HEAD)"
          sed -i "s/__BUILD__/${build}/" _site/sw.js
          grep -q "const VERSION = '${build}'" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # A veces la API tarda en listar el artefacto recién subido («Found 0 artifact(s)»): un segundo intento lo resuelve.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Esperar antes de reintentar
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
